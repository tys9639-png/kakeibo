# Supabase の無料プランは7日間アクセスがないと自動で一時停止される。
# 3日おきに軽い問い合わせを送って、停止を防ぐ。
# 使っているキーは index.html にも書かれている公開用の anon キー（RLS により未ログインでは空の結果）。
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */3 * *"   # 3日おき（日本時間 12:00 頃）
  workflow_dispatch:         # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SB_URL: https://fnqfkgtvxygoysxzxnqw.supabase.co
          SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZucWZrZ3R2eHlnb3lzeHp4bnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzkzMDUsImV4cCI6MjEwMTkxNTMwNX0.I1mx69APBuDvdNouLNLgPZlr7rArodO-sppnAZGNMKc
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON")
          echo "HTTP $code"
          test "$code" = "200"
